<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiateur Monitor</title>
</head>
<body>
    <h1>Statut du Radiateur</h1>
    <p>Température : {{ data.temperature }}°C</p>
    <p>Température ressentie : {{ data.temperature_ressentie }}°C</p>
    <p>Humidité : {{ data.humidity }}%</p>
    <p>Température extérieure : {{ data.temperature_exterieure }} °C</p>
    <p>État du radiateur : {{ data.radiator_state }}</p>
    <h2>Réglage de la température</h2>
    <label for="temp_consigne">Température de consigne :</label>
    <input type="number" id="temp_consigne" step="1" value="{{ data.temp_consigne }}" required>
    <button onclick="updateTemperature()">Mettre à jour</button>
    <script>
        function updateTemperature() {
            const temp_consigne = document.getElementById('temp_consigne').value;
            fetch('/set_temperature', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ temp_consigne: parseFloat(temp_consigne) })
            })
            .then(response => response.json())
            .then(data => alert(data.message))
            .catch(error => console.error('Erreur :', error));
        }
    </script>
    </br>
    <iframe src="https://grafana.sogliuzzo.com/d-solo/ae7vyyccgjxfke/radiateur?orgId=1&timezone=browser&showCategory=Graph%20styles&theme=light&panelId=4&__feature.dashboardSceneSolo" width="900" height="400" frameborder="0"></iframe>
    <iframe src="https://grafana.sogliuzzo.com/d-solo/ae7vyyccgjxfke/radiateur?orgId=1&timezone=browser&showCategory=Graph%20styles&theme=light&panelId=3&__feature.dashboardSceneSolo" width="900" height="400" frameborder="0"></iframe>
</body>
</html>
