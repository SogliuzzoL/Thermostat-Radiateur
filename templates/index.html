<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <title>Radiateur Monitor</title>
</head>
<body>
    <h1>Statut du Radiateur</h1>
    <p>Température : {{ data.temperature }}°C</p>
    <p>Température ressentie : {{ data.temperature_ressentie }}°C</p>
    <p>Humidité : {{ data.humidity }}%</p>
    <p>État du radiateur : {{ data.radiator_state }}</p>
    <h2>Réglage de la température</h2>
    <form action="/set_temperature" method="post">
        <label for="temp_consigne">Température de consigne :</label>
        <input type="number" id="temp_consigne" name="temp_consigne" step="0.1" value="{{ data.temperature_consigne }}" required>
        <button type="submit">Mettre à jour</button>
    </form>
    
    <script>
        document.getElementById("tempForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Empêche l'envoi du formulaire classique

            const tempConsigne = document.getElementById("temp_consigne").value;

            fetch("https://raspi.sogliuzzo.com/set_temperature", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json",
                },
                body: JSON.stringify({ temp_consigne: parseFloat(tempConsigne) })
            })
            .then(response => response.json()) // Attendre la réponse du serveur en JSON
            .then(data => {
                console.log("Réponse du serveur:", data);
                // Vous pouvez afficher une confirmation ou effectuer une autre action
            })
            .catch(error => {
                console.error("Erreur:", error);
            });
        });
    </script>

</body>
</html>
